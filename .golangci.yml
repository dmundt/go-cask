# The gate's static analysis, pinned by internal/build/policy's Linter table.
#
# `layer-matrix` remains the owner of the import matrix: this depguard block is a second,
# faster signal that mirrors it, so a violation surfaces in an editor rather than after a
# whole gate run. The rule of record, and its tests, are internal/build/layers with
# go-cask's arm table in internal/build/policy. Layered settings are Go function values
# (OwnsTree, OwnsExact, OwnsAnyTree) and cannot be read from YAML, which is why this is a
# mirror and not the owner.
#
# Two places the mirror necessarily differs from the matrix, both stated rather than implied:
#
#   - The matrix constrains module-local imports only — the standard library and third-party
#     dependencies are outside it. depguard has no such "module-local only" form, so every
#     rule lists `$gostd` and each approved dependency explicitly. A new dependency in go.mod
#     is therefore also a row to add here; golang.org/x/sys is the one approved exception
#     (docs/specs/coding-guidelines.md §3).
#   - The matrix reads `go list`, which omits imports that occur only in _test.go files, so a
#     cas/** test may keep importing internal/test. Judging test files here would report a
#     violation the owner does not, so the rules exclude them.
version: "2"

linters:
  default: none
  enable:
    - depguard
    - errorlint
    - errcheck
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # The accepted set, one entry per reason, is written out here rather than taken
      # from a shipped preset. golangci-lint's own std-error-handling preset ignores
      # every `.Close`, `os.Remove` and `fmt.Fprint*` in the module — it would have
      # hidden the unchecked write-path closes go-cask#489 exists to find, with the
      # finding invisible in this file. What is accepted instead:
      #
      #   - fmt.Fprint/Printf/Println write one line to the CLI's stdout or stderr, or
      #     to the buffer inside a test. The writer cannot fail on a pipe or a file the
      #     process is about to exit on, and where it can (a closed stdout) there is no
      #     error path to take. 221 of go-cask#489's production findings were these.
      #   - (*os.File).Write repeats that for the tool output the subcommands stream.
      #
      # Test files are judged by default (240 of the 477 findings the linter reported
      # when go-cask#489 enabled it were in them) and excluded whole by the rule below: a test's failure is the assertion
      # it writes, not the error a fixture's Close returns, and the repository's tests
      # do assert the closes that matter (they call Close and check it).
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Write
    depguard:
      rules:
        cas:
          files:
            - "**/cas/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - golang.org/x/sys
            - github.com/dmundt/go-cask/cas
        gitlike:
          files:
            - "**/gitlike/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - golang.org/x/sys
            - github.com/dmundt/go-cask/cas
        product:
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - golang.org/x/sys
            - github.com/dmundt/go-cask/cas
            - github.com/dmundt/go-cask/internal
        teaching:
          files:
            - "**/examples/**"
            - "**/benchmarks/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - golang.org/x/sys
            - github.com/dmundt/go-cask/cas
            - github.com/dmundt/go-cask/gitlike
        codec-guard:
          files:
            - "**/gitlike/**"
            - "**/cas/pack/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/dmundt/go-cask/cas/codec
              desc: the codec layer is the caller's to choose; inject codecs via gitlike.Codecs, or have the caller pass the codec
    staticcheck:
      # Correctness checks only. ST* is style and QF* is a quickfix suggestion; both would
      # judge prose the specification set already owns.
      checks:
        - all
        - -ST*
        - -QF*
  # exclusions narrows errcheck site by site. Nothing here is a general form — a pattern
  # over whole directories or whole receiver types — because each one below stands for a
  # site that was read and accepted, with the reason and the tracking issue written down.
  # go-cask#489 handled the production sites inside its own scope and recorded the rest as
  # debt: the files it may not carry (another lane owns them, or the site is outside the
  # issue's five) keep their finding ignored, visible here, until their own issue closes.
  exclusions:
    rules:
      # A test's subject is the behaviour under test; its fixtures return close errors
      # nobody asserts. The tests that do assert a close call it and check the result
      # (TestSetAndDeleteReportReflogFailures, packfs's close tests), so this rule hides no
      # failure a test was watching for.
      - path: '.*_test\.go'
        linters:
          - errcheck

      # --- accepted debt, one rule per site (go-cask#489) ---

      # A read-only startup-token handle, already read in full when the deferred close runs
      # (cmd/cask/web.go). The same is true of the demo client's upload file and of the two
      # response bodies the demo and the example server hold for a consumed response.
      - path: 'cmd/cask/web\.go'
        text: 'f\.Close'
        linters:
          - errcheck
      - path: 'examples/api/demo/main\.go'
        text: '\.Close'
        linters:
          - errcheck
      - path: 'examples/api/server/server\.go'
        text: 'rc\.Close'
        linters:
          - errcheck

      # The shared test helper closes a read-only handle (internal/test/helpers.go), and the
      # viewer's preview read does the same (internal/web/web.go). Both are package files,
      # so the _test.go rule above does not reach them.
      - path: 'internal/test/helpers\.go'
        text: 'rc\.Close'
        linters:
          - errcheck
      - path: 'internal/web/web\.go'
        text: 'rc\.Close'
        linters:
          - errcheck

      # Three write-path closes outside go-cask#489's five, in files this change must not
      # carry: the lane record's append (cmd/gate/prlane.go) and the slot record's
      # published claim (cmd/gate/landlane.go, where the close beside the write's own
      # error return is the one ignored). Each wants an issue of its own.
      - path: 'cmd/gate/prlane\.go'
        text: 'file\.Close'
        linters:
          - errcheck
      - path: 'cmd/gate/landlane\.go'
        text: 'file\.Close'
        linters:
          - errcheck

      # Removals whose failure is already reported by the step that follows them: the gate's
      # scratch cleanup (cmd/gate/verify.go) and the CLI's lock-file release
      # (cmd/cask/lock.go).
      - path: 'cmd/gate/verify\.go'
        text: 'os\.Remove'
        linters:
          - errcheck
      - path: 'cmd/cask/lock\.go'
        text: 'os\.Remove'
        linters:
          - errcheck
