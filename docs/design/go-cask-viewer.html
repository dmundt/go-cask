<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go-cask object browser</title>
  <style>
    :root { --bg: oklch(98% .005 250); --surface: oklch(100% 0 0); --fg: oklch(22% .02 240); --muted: oklch(50% .018 240); --border: oklch(90% .008 240); --accent: oklch(48% .14 145); --blue: oklch(50% .13 250); --blue-soft: oklch(96% .035 250); --font: 'Segoe UI', Helvetica, system-ui, sans-serif; --mono: 'JetBrains Mono', 'IBM Plex Mono', Consolas, ui-monospace, monospace; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15.4px/1.45 var(--font); overflow: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mono, code { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .topbar { height: 46px; display: flex; align-items: center; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 17.6px; font-weight: 700; letter-spacing: -.02em; }
    .mark { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: var(--fg); color: var(--surface); font: 700 9.9px var(--mono); }
    .verify-all { height: 28px; margin-left: auto; padding: 0 10px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: var(--surface); font-size: 12.1px; font-weight: 650; }
    .verify-all:hover:not(:disabled) { background: color-mix(in oklch, var(--accent) 86%, var(--fg)); border-color: color-mix(in oklch, var(--accent) 86%, var(--fg)); }
    .verify-all:disabled { opacity: .6; cursor: wait; }
    .filters { height: 47px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .input, select { height: 30px; padding: 0 9px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--fg); font-size: 13.2px; }
    .search-wrap { position: relative; display: inline-flex; align-items: center; height: 30px; }
    .search-wrap::before { content: '⌕'; position: absolute; left: 9px; top: 0; bottom: 0; z-index: 1; display: grid; place-items: center; color: var(--muted); font: 19.8px/1 var(--font); pointer-events: none; }
    .input { width: 260px; padding-left: 28px; padding-right: 28px; font-family: var(--mono); }
    .clear-search { position: absolute; right: 5px; top: 50%; display: none; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font: 17.6px/1 var(--font); transform: translateY(-50%); }
    .clear-search.visible { display: grid; }
    .clear-search:hover { background: color-mix(in oklch, var(--fg) 6%, var(--surface)); color: var(--fg); }
    select { width: 130px; }
    .reset { border: 0; background: transparent; color: var(--accent); font-size: 12.1px; }
    .reset:hover { background: color-mix(in oklch, var(--accent) 12%, var(--surface)); border-radius: 4px; }
    .workspace { --inspector-width: 440px; height: calc(100vh - 93px); display: grid; grid-template-columns: minmax(0, 1fr) 4px var(--inspector-width); background: var(--surface); }
    .list { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .table-wrap { flex: 1; min-height: 0; overflow: auto; background: var(--bg); }
    .table-wrap table { background: var(--surface); }
    table { width: 100%; min-width: 700px; table-layout: fixed; border-collapse: collapse; font: 13.2px var(--mono); }
    th, td { padding: 8px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th, td { width: 14%; overflow: hidden; text-overflow: ellipsis; }
    th:first-child, td:first-child { width: 30%; }
    th { position: sticky; top: 0; z-index: 1; padding-block: 7px; background: var(--bg); color: var(--muted); font-size: 12.65px; line-height: 1.2; letter-spacing: .07em; text-transform: uppercase; }
    .sort-head { display: inline-flex; align-items: center; gap: 4px; }
    th.right .sort-head { justify-content: end; }
    .sort-button { width: 14px; height: 14px; padding: 0; border: 0; background: transparent; color: var(--muted); font: 9.9px/1 var(--mono); }
    .sort-button:hover, .sort-button.active { color: var(--fg); }
    td.right, th.right { text-align: right; }
    tbody tr { cursor: pointer; outline: none; }
    tbody tr:hover td { background: color-mix(in oklch, var(--fg) 3%, var(--surface)); }
    tbody tr.selected td { background: color-mix(in oklch, var(--fg) 10%, var(--surface)); color: var(--fg); }
    tbody tr.selected .type { color: var(--muted); }
    tbody tr.selected td:first-child { box-shadow: inset 2px 0 color-mix(in oklch, var(--fg) 55%, transparent); }
    tbody tr:focus-visible td { outline: 2px solid var(--accent); outline-offset: -2px; }
    .type { color: var(--muted); }
    .status-tag { display: inline-flex; align-items: center; min-height: 19px; padding: 1px 6px; border: 0; border-radius: 3px; font: 700 10px/1.2 var(--font); letter-spacing: 0; text-transform: capitalize; }
    .status-tag.verified { background: oklch(97% .03 145); color: oklch(40% .12 145); }
    .status-tag.unverified { background: oklch(96% .006 240); color: oklch(45% .012 240); }
    .status-tag.orphaned { background: oklch(97% .03 78); color: oklch(50% .115 70); }
    .status-tag.corrupt { background: oklch(97% .028 25); color: oklch(49% .15 25); }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 14px; border-top: 1px solid var(--border); color: var(--muted); font: 12.65px var(--mono); }
    .pager-controls { display: flex; align-items: center; gap: 5px; }
    .pager select { width: 68px; height: 27px; font: 12.1px var(--mono); }
    .page-button { min-width: 27px; height: 27px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--fg); font: 12.1px var(--mono); }
    .page-button:hover:not(:disabled) { background: var(--bg); border-color: var(--fg); }
    .page-button:disabled { opacity: .4; cursor: not-allowed; }
    .empty-row td { padding: 42px 13px; text-align: center; color: var(--muted); font-family: var(--font); }
    .splitter { position: relative; cursor: col-resize; background: var(--border); touch-action: none; }
    .splitter::after { content: ''; position: absolute; inset: 0 -5px; }
    .splitter:hover, .splitter.dragging { background: var(--accent); }
    .splitter:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent); }
    .inspector { overflow: auto; min-width: 0; }
    .inspector-head { padding: 13px 14px 11px; border-bottom: 1px solid var(--border); background: var(--bg); }
    /* Inspector hierarchy: context labels 11.5px, controls/data 12px, hashes 12px mono. */
    .inspector-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 7px; }
    .inspector-head h1 { margin: 0; color: var(--muted); font: 700 12.65px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .history-back { height: 22px; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--fg); font: 11px/1 var(--mono); }
    .history-back:hover:not(:disabled) { background: var(--bg); border-color: var(--fg); }
    .history-back:disabled { opacity: .4; cursor: not-allowed; }
    .hash { overflow-wrap: anywhere; font: 13.2px/1.45 var(--mono); }
    .hash-row { display: flex; align-items: flex-start; gap: 7px; }
    .hash-row .hash { flex: 1; min-width: 0; }
    .copy-hash { display: none; flex: 0 0 auto; width: 25px; height: 25px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--muted); font: 15.4px/1 var(--mono); }
    .copy-hash.visible { display: grid; place-items: center; }
    .copy-hash:hover { color: var(--fg); border-color: var(--fg); }
    .copy-hash:focus-visible, .page-button:focus-visible, .sort-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 10px 7px; border: 0; border-bottom: 2px solid transparent; border-radius: 4px 4px 0 0; background: transparent; color: var(--muted); font-size: 13.2px; font-weight: 510; line-height: 1.25; }
    .tab:hover { color: var(--fg); background: color-mix(in oklch, var(--fg) 4%, var(--surface)); }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 650; }
    .pane { display: none; padding: 15px 14px; }
    .pane.active { display: block; }
    .pane-empty { margin: 2px 0 0; color: var(--muted); font-size: 13.2px; }
    .section { margin-bottom: 20px; }
    .section:last-child { margin-bottom: 0; }
    .section h2 { margin: 0 0 8px; color: var(--muted); font: 700 12.1px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; margin: 0; }
    dt { color: var(--muted); font-size: 12.1px; font-weight: 450; line-height: 1.45; }
    dd { margin: 0; overflow-wrap: anywhere; font: 13.2px/1.45 var(--mono); }
    .ref-list { display: grid; gap: 6px; }
    .ref-list.empty { display: block; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .ref { display: flex; width: fit-content; max-width: 100%; gap: 7px; align-items: center; padding: 2px 3px; border: 0; border-radius: 3px; background: transparent; color: var(--fg); font: 13.2px/1.4 var(--mono); text-align: left; }
    .ref:hover { background: color-mix(in oklch, var(--fg) 4%, var(--surface)); }
    .ref:focus-visible, .history-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ref-kind { padding: 2px 5px; border-radius: 3px; background: var(--blue-soft); color: var(--blue); font: 700 9.9px var(--font); letter-spacing: .06em; text-transform: uppercase; }
    pre { margin: 0; overflow: auto; font: 12.1px/1.65 var(--mono); color: color-mix(in oklch, var(--fg) 85%, var(--muted)); }
    .empty-detail { color: var(--muted); font-size: 13.2px; }
    @media (max-width: 900px) { body { overflow: auto; } .filters { overflow-x: auto; } .workspace { height: auto; min-height: calc(100vh - 93px); grid-template-columns: 1fr; } .list { min-height: 440px; } .splitter { display: none; } .inspector { border-top: 1px solid var(--border); } }
  </style>
</head>
<body>
  <header class="topbar" data-od-id="top-bar"><div class="brand" data-od-id="brand"><span class="mark">CA</span>go-cask</div><button class="verify-all" id="verify-all" type="button" data-od-id="verify-all">Verify</button></header>
  <form class="filters" data-od-id="filter-bar">
    <span class="search-wrap" style="width: 262px;"><input class="input" id="search" aria-label="Search objects" placeholder="Search digest prefix or type"><button class="clear-search" id="clear-search" type="button" aria-label="Clear search" title="Clear search" style="height: 30px; width: 30px; padding-top: 0px; padding-right: 0px; font-weight: 400;">×</button></span>
    <select id="type-filter" aria-label="Object type"><option value="">All types</option><option value="bytes@1">bytes@1</option><option value="json@1">json@1</option><option value="text@1">text@1</option></select>
    <select id="size-filter" aria-label="Size"><option value="">Any size</option><option value="small">&lt; 1 KiB</option><option value="medium">1 KiB - 1 MiB</option><option value="large">&gt; 1 MiB</option></select>
    <select id="state-filter" aria-label="Object state" data-od-id="state-filter"><option value="">Any state</option><option value="verified">Verified</option><option value="unverified">Unverified</option><option value="orphaned">Orphaned</option><option value="corrupt">Corrupt</option></select>
    <button class="reset" type="reset" data-od-id="reset-filters">Reset</button>
  </form>
  <main class="workspace" data-od-id="object-browser">
    <section class="list">
      <div class="table-wrap"><table data-od-id="object-table"><thead><tr><th aria-sort="ascending"><span class="sort-head">Hash<button class="sort-button active" type="button" data-sort="hash" aria-label="Sort hash ascending" aria-pressed="true">▲</button></span></th><th aria-sort="none"><span class="sort-head">Type<button class="sort-button" type="button" data-sort="type" aria-label="Sort type ascending" aria-pressed="false">▲</button></span></th><th class="right" aria-sort="none"><span class="sort-head">Size<button class="sort-button" type="button" data-sort="size" aria-label="Sort size ascending" aria-pressed="false">▲</button></span></th><th class="right" aria-sort="none"><span class="sort-head">Refs<button class="sort-button" type="button" data-sort="refsBy" aria-label="Sort references ascending" aria-pressed="false">▲</button></span></th><th aria-sort="none"><span class="sort-head">Status<button class="sort-button" type="button" data-sort="status" aria-label="Sort status ascending" aria-pressed="false">▲</button></span></th><th class="right" aria-sort="none"><span class="sort-head">Written<button class="sort-button" type="button" data-sort="written" aria-label="Sort written ascending" aria-pressed="false">▲</button></span></th></tr></thead><tbody id="object-rows"></tbody></table></div>
      <footer class="pager" data-od-id="object-pager"><span id="result-count">0 objects</span><div class="pager-controls"><label for="page-size">Rows</label><select id="page-size" aria-label="Rows per page"><option value="25">25</option><option value="50">50</option><option value="100">100</option><option value="250">250</option></select><button class="page-button" type="button" id="first-page" aria-label="First page">«</button><button class="page-button" type="button" id="previous-page" aria-label="Previous page">‹</button><span id="page-status">Page 1 of 1</span><button class="page-button" type="button" id="next-page" aria-label="Next page">›</button><button class="page-button" type="button" id="last-page" aria-label="Last page">»</button></div></footer>
    </section>
    <div class="splitter" id="pane-splitter" role="separator" aria-label="Resize object inspector" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="560" aria-valuenow="440" tabindex="0" data-od-id="pane-splitter"></div>
    <aside class="inspector" data-od-id="inspector">
      <header class="inspector-head"><div class="inspector-title"><h1>Object</h1><button class="history-back" id="history-back" type="button" aria-label="Go back to the previous object" disabled>Back</button></div><div class="hash-row"><div class="hash" id="detail-hash"></div><button class="copy-hash" id="copy-hash" type="button" aria-label="Copy full object hash" title="Copy hash">⧉</button></div></header>
      <nav class="tabs" role="tablist" aria-label="Object detail tabs"><button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="metadata" id="metadata-tab" data-tab="metadata">Metadata</button><button class="tab" type="button" role="tab" aria-selected="false" aria-controls="references" id="references-tab" data-tab="references">References</button><button class="tab" type="button" role="tab" aria-selected="false" aria-controls="bytes" id="bytes-tab" data-tab="bytes">Bytes</button></nav>
      <section class="pane active" id="metadata" role="tabpanel" aria-labelledby="metadata-tab"><div class="section"><h2>Identity</h2><dl><dt>Algorithm</dt><dd id="detail-algorithm"></dd><dt>Type</dt><dd id="detail-type"></dd></dl></div><div class="section"><h2>Storage</h2><dl><dt>Size</dt><dd id="detail-size"></dd><dt>References</dt><dd id="detail-refs"></dd><dt>Written</dt><dd id="detail-written"></dd><dt>Timestamp</dt><dd id="detail-timestamp"></dd></dl></div><div class="section"><h2>Integrity</h2><dl><dt>Status</dt><dd id="detail-status"></dd></dl></div></section>
      <section class="pane" id="references" role="tabpanel" aria-labelledby="references-tab"><div class="section"><h2>By</h2><div class="ref-list" id="referenced-by"></div></div><div class="section"><h2>Out</h2><div class="ref-list" id="references-out"></div></div></section>
      <section class="pane" id="bytes" role="tabpanel" aria-labelledby="bytes-tab"><pre id="hexdump"></pre></section>
    </aside>
  </main>
  <script>
    const store = [];
    const types = ['bytes@1', 'json@1', 'text@1'];
    const sizes = ['128 B', '986 B', '2.1 KiB', '48 KiB', '384 KiB', '1.2 MiB'];
    for (let index = 0; index < 512; index++) {
      const digest = (index.toString(16).padStart(8, '0') + 'cask' + (index * 2654435761 >>> 0).toString(16).padStart(8, '0')).repeat(4).slice(0, 64);
      const ageHours = index + 1;
      store.push({ hash: 'sha256:' + digest, type: types[index % types.length], size: sizes[index % sizes.length], refsBy: index % 4 === 2 ? 0 : index % 20 + 1, refsOut: (index * 3) % 14, written: ageHours < 24 ? `${ageHours}h ago` : `${Math.floor(ageHours / 24)}d ago`, writtenAt: Date.now() - ageHours * 3600000 });
    }
    let selected = -1; let page = 1; let sort = { column: 'hash', direction: 'asc' }; const objectHistory = []; const verificationResults = new Map();
    const rows = document.getElementById('object-rows');
    const search = document.getElementById('search'); const clearSearch = document.getElementById('clear-search');
    const typeFilter = document.getElementById('type-filter');
    const sizeFilter = document.getElementById('size-filter'); const stateFilter = document.getElementById('state-filter'); const pageSize = document.getElementById('page-size');
    const shortHash = hash => hash.slice(0, 15) + '…';
    const objectState = object => verificationResults.get(object.hash) || 'unverified';
    const byteSize = value => { const [n, unit] = value.split(' '); return Number(n) * ({ B: 1, KiB: 1024, MiB: 1048576 }[unit] || 0); };
    const formatTotal = value => value >= 1048576 ? `${Math.round(value / 1048576)} MB` : value >= 1024 ? `${Math.round(value / 1024)} KB` : `${value} B`;
    const hexPreview = hash => { const seed = hash.slice(hash.indexOf(':') + 1); return Array.from({ length: 8 }, (_, row) => { const chunk = Array.from({ length: 16 }, (_, index) => parseInt(seed.slice(((row * 16 + index) * 2) % seed.length, ((row * 16 + index) * 2) % seed.length + 2), 16)); return `${(row * 16).toString(16).padStart(8, '0')}  ${chunk.map(byte => byte.toString(16).padStart(2, '0')).join(' ')}  |${chunk.map(byte => byte > 31 && byte < 127 ? String.fromCharCode(byte) : '.').join('')}|`; }).join('\n'); };
    function ref(direction, kind, targetIndex) { const target = store[targetIndex]; const item = document.createElement('button'); item.type = 'button'; item.className = 'ref'; item.setAttribute('aria-label', `Open ${target.hash}`); item.append(Object.assign(document.createElement('span'), { textContent: direction }), Object.assign(document.createElement('span'), { className: 'ref-kind', textContent: kind }), Object.assign(document.createElement('code'), { textContent: shortHash(target.hash) })); item.addEventListener('click', () => selectObject(targetIndex, true)); return item; }
    function updateHistoryControl() { document.getElementById('history-back').disabled = objectHistory.length === 0; }
    function clearDetail() { ['detail-hash', 'detail-algorithm', 'detail-type', 'detail-size', 'detail-refs', 'detail-written', 'detail-timestamp', 'detail-status', 'hexdump'].forEach(id => document.getElementById(id).textContent = ''); document.getElementById('copy-hash').classList.remove('visible'); document.getElementById('referenced-by').replaceChildren(); document.getElementById('references-out').replaceChildren(); updateHistoryControl(); }
    function statusTag(status) { const tag = document.createElement('span'); tag.className = `status-tag ${status}`; tag.textContent = status; return tag; }
    function showDetail(object) { if (!object) return clearDetail(); document.getElementById('detail-hash').textContent = object.hash; document.getElementById('copy-hash').classList.add('visible'); document.getElementById('detail-algorithm').textContent = 'sha256'; document.getElementById('detail-type').textContent = object.type; document.getElementById('detail-size').textContent = object.size; document.getElementById('detail-refs').textContent = object.refsBy; document.getElementById('detail-written').textContent = object.written; document.getElementById('detail-timestamp').textContent = new Date(object.writtenAt).toISOString(); document.getElementById('detail-status').replaceChildren(statusTag(objectState(object))); document.getElementById('hexdump').textContent = hexPreview(object.hash); const inbound = document.getElementById('referenced-by'); const outbound = document.getElementById('references-out'); inbound.classList.toggle('empty', object.refsBy === 0); outbound.classList.toggle('empty', object.refsOut === 0); inbound.replaceChildren(...Array.from({ length: object.refsBy }, (_, i) => ref('←', 'manifest', (selected + i + 1) % store.length))); outbound.replaceChildren(...Array.from({ length: object.refsOut }, (_, i) => ref('→', 'blob', (selected + i + 97) % store.length))); if (!inbound.childElementCount) inbound.textContent = 'No objects reference this object.'; if (!outbound.childElementCount) outbound.textContent = 'This object references no other objects.'; updateHistoryControl(); }
