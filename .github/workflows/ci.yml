name: CI

# Enforces the gates required by the instruction set:
#   coding-guidelines §9   — gofmt, go vet, go test, go build; no product → examples imports
#   testing-strategy §5    — -race, coverage ≥ 90% on cas/ + cas/extra + gitlike, fuzz smoke
#   performance §5         — benchmark regression gate (>10% time vs committed Linux baseline)
#   AGENT.md §9            — document integrity (mermaid balance, file refs)
#
# Go steps activate automatically once Go code exists (guarded by
# hashFiles('**/*.go')); the doc-integrity step always runs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # baseline refresh commits benchmarks/cas.txt
    steps:
      - uses: actions/checkout@v5
        with:
          # On PRs, check out the head branch itself (not the merge ref) so
          # the baseline-refresh step can commit and push to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # std-lib-only module: no go.sum to key a module cache on
          cache: false

      - name: gofmt (no unformatted files)
        if: hashFiles('**/*.go') != ''
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }

      - name: go mod tidy (no drift)
        if: hashFiles('**/*.go') != ''
        run: |
          go mod tidy
          git diff --exit-code go.mod
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi # std-lib-only module has no go.sum

      - name: go vet
        if: hashFiles('**/*.go') != ''
        run: go vet ./...

      - name: Import boundaries (no product → examples imports)
        if: hashFiles('**/*.go') != ''
        run: |
          if grep -rn "dmundt/go-cask/examples" cas internal cmd; then
            echo "cas/, internal/ and cmd/ MUST NOT import examples/ (coding-guidelines §9)"
            exit 1
          fi

      - name: Test -race + coverage gate (cas/ + cas/extra + gitlike >= 90%)
        if: hashFiles('**/*.go') != ''
        run: |
          fail=0
          # One package per invocation so each package's coverage line is
          # gated individually (./cas/... would mask cas behind cas/extra).
          for pkg in ./cas ./cas/extra ./examples/gitlike; do
            out="$(go test -race -cover "$pkg")"
            echo "$out"
            cov="$(echo "$out" | grep -oP 'coverage: \K[0-9.]+(?=%)' | tail -1)"
            if [ -n "$cov" ] && [ "$(awk -v c="$cov" 'BEGIN{print (c+0 >= 90.0) ? 1 : 0}')" != "1" ]; then
              echo "coverage $cov% below 90% for $pkg"; fail=1
            fi
          done
          go test -race ./...
          exit $fail

      - name: Fuzz smoke
        if: hashFiles('**/*.go') != ''
        run: |
          # -fuzz cannot target multiple packages, and ./cas/... now matches
          # cas + cas/extra; the fuzz targets live in package cas only.
          go test -run=^$ -fuzz=FuzzParseHash -fuzztime=5s ./cas/
          go test -run=^$ -fuzz=FuzzPathRoundTrip -fuzztime=5s ./cas/
          go test -run=^$ -fuzz=FuzzCodecRoundTrip -fuzztime=5s ./cas/
          go test -run=^$ -fuzz=FuzzVerify -fuzztime=5s ./cas/

      - name: Benchmarks (cas)
        if: hashFiles('**/*.go') != ''
        run: go test -bench=. -benchmem -count=5 -run=^$ ./cas/... > /tmp/bench.txt

      - name: Refresh benchmark baseline (Linux runner)
        if: hashFiles('benchmarks/REFRESH') != '' && hashFiles('**/*.go') != ''
        run: |
          cp /tmp/bench.txt benchmarks/cas.txt
          git rm -q benchmarks/REFRESH
          git config user.name "go-cask"
          git config user.email "go-cask@users.noreply.github.com"
          git add benchmarks/cas.txt
          git commit -m "ci: refresh Linux benchmark baseline" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}

      - name: Benchmark regression gate (allocs/op vs baseline fails)
        if: hashFiles('**/*.go') != ''
        run: |
          # Bench lines (with -benchmem + SetBytes) are:
          #   name-4  count  ns/op  "ns/op"  MB/s  "MB/s"  B/op  "B/op"  allocs  "allocs/op"
          # so the allocs/op value is field 9. Shared ubuntu-latest runners
          # vary in hardware, so wall-clock time cannot be gated: fail on ANY
          # increase in allocs/op (hardware-independent, deterministic for
          # identical code). Time is printed for humans only.
          awk '
            NR==FNR { if ($0 ~ /^Benchmark/) { sub(/-[0-9]+$/, "", $1); if (!($1 in base) || $9 + 0 < base[$1]) base[$1] = $9 + 0; if (!($1 in tb) || $3 + 0 < tb[$1]) tb[$1] = $3 + 0 } next }
            $0 ~ /^Benchmark/ {
              sub(/-[0-9]+$/, "", $1)
              if (!($1 in cur) || $9 + 0 < cur[$1]) cur[$1] = $9 + 0
              if (!($1 in tc) || $3 + 0 < tc[$1]) tc[$1] = $3 + 0
            }
            END {
              for (n in base) if (n in cur) {
                if (cur[n] > base[n]) { printf "%s: allocs/op %d -> %d (regression)\n", n, base[n], cur[n]; fail = 1 }
              }
              for (n in tb) if (n in tc) printf "  (info) %s: ns/op %d -> %d\n", n, tb[n], tc[n]
              exit fail
            }
          ' benchmarks/cas.txt /tmp/bench.txt

      - name: Doc integrity (.github/instructions)
        run: |
          cd .github/instructions
          fail=0
          for f in *.md; do
            m="$(grep -c '^```mermaid$' "$f" || true)"
            c="$(grep -c '^```$' "$f" || true)"
            if [ "$c" -lt "$m" ]; then echo "unbalanced mermaid in $f"; fail=1; fi
          done
          for ref in $(grep -rho '[a-z0-9-]*\.instructions\.md' . | sort -u); do
            case "$ref" in
              guidelines.instructions.md|go-coding-guidelines.instructions.md|.instructions.md) continue ;; # known false positives (pattern literals in AGENT.md)
            esac
            [ -f "$ref" ] || { echo "broken reference: $ref"; fail=1; }
          done
          exit $fail
