name: CI

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.8.0

# Enforces the gates required by the instruction set:
#   coding-guidelines §9   — gofmt, go vet, go test, go build; no product → examples imports
#   testing-strategy §5    — -race, tiered coverage gates, fuzz smoke
#   AGENT.md §9            — document integrity (mermaid balance, file refs)
#
# The required verify context always runs. Expensive security and native
# platform jobs run only for changes that can affect them.
#
# The gate itself is not repeated when it does not have to be. `scripts/verify.sh`
# already ran it on this host before the branch was pushed, and `.githooks/pre-push`
# published that run as a signed receipt under `refs/gate/<head-sha>`
# (`scripts/gate-receipt.sh`, trust anchored in `.github/gate-signers`). The
# `verify` job checks that receipt against the commit it is really testing — the
# signature, the head commit, the tree of the checked-out merge result, the base
# and the diff hash recomputed here, the scope, and the list of checks the gate
# would otherwise repeat — and only then skips the suite. Anything short of that
# (no receipt, a fork, an unsigned local gate, a branch that fell behind main, a
# renamed gate section) leaves the receipt unusable and the whole gate runs below.
# The fast path is entered by evidence; it cannot be entered by its absence, and
# the required check names stay exactly what branch protection names.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      go_changed: ${{ steps.scope.outputs.go_changed }}
      website_changed: ${{ steps.scope.outputs.website_changed }}
      security_changed: ${{ steps.scope.outputs.security_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            echo "website_changed=true" >> "$GITHUB_OUTPUT"
            echo "security_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "docs_only=$(bash ./scripts/docs-only.sh "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

          if grep -Eq '(^|/).*\.go$|^go\.(mod|sum)$' <<< "$changed_files"; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            echo "security_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
            if grep -Eq '^scripts/(security|verify)\.sh$|^\.github/workflows/ci\.yml$' <<< "$changed_files"; then
              echo "security_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "security_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          if grep -Eq '^website/|^mkdocs\.yml$|^requirements-docs\.(txt|lock)$|^\.github/workflows/website\.yml$' <<< "$changed_files"; then
            echo "website_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "website_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the local gate receipt
        id: receipt
        # Every failure here — no ref, an untrusted signature, a tree that is not
        # the one checked out, a base this branch does not contain, a check the
        # receipt cannot show — leaves the receipt unusable and the whole gate
        # runs below. `continue-on-error` is what makes that fallback invisible to
        # the job: the step's OUTCOME carries the verdict, and its status never
        # fails the build. On any non-pull-request run there is no head commit the
        # local gate could have covered, so the step does not run at all.
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # refs/gate/* usually does not exist for a first push or a fork; that is
          # the ordinary case, not a failure.
          git fetch --no-tags --quiet origin '+refs/gate/*:refs/gate/*' || true
          bash ./scripts/gate-receipt.sh verify \
            --sha "$HEAD_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --base "$BASE_SHA" \
            --require-suite full

      - name: Set up Go
        if: steps.scope.outputs.docs_only != 'true' && steps.receipt.outcome != 'success'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Dependency set is small and verify checks module drift explicitly.
          cache: false

      - name: Verify repo
        if: steps.scope.outputs.docs_only != 'true' && steps.receipt.outcome != 'success' && hashFiles('**/*.go') != ''
        env:
          VERIFY_SKIP_SECURITY: 'true'
        run: bash ./scripts/verify.sh

      - name: Verify documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Set up Python
        if: steps.scope.outputs.website_changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        if: steps.scope.outputs.website_changed == 'true'
        run: python -m pip install --require-hashes -r requirements-docs.lock

      - name: Verify documentation site
        if: steps.scope.outputs.website_changed == 'true'
        env:
          IMPRESSUM: CI verification address
        run: python -m mkdocs build --strict

  security:
    needs: verify
    if: needs.verify.outputs.security_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        run: bash ./scripts/security.sh

  platform-matrix:
    needs: [verify, security]
    if: needs.verify.outputs.go_changed == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            smoke: true
          - name: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...

      - name: Smoke test on native platform
        if: ${{ matrix.smoke }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test ./...

  platforms:
    name: platforms
    needs: [verify, security, platform-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required platform results
        shell: bash
        env:
          GO_CHANGED: ${{ needs.verify.outputs.go_changed }}
          PLATFORM_RESULT: ${{ needs.platform-matrix.result }}
        run: |
          if [[ "$GO_CHANGED" == "true" && "$PLATFORM_RESULT" != "success" ]]; then
            echo "platform matrix result: $PLATFORM_RESULT" >&2
            exit 1
          fi
