name: CI

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.8.0

# Enforces the gates required by the instruction set:
#   coding-guidelines §9   — gofmt, go vet, go test, go build; no product → examples imports
#   testing-strategy §5    — -race, coverage ≥ 90% on cas/ + gitlike, fuzz smoke
#   AGENT.md §9            — document integrity (mermaid balance, file refs)
#
# Go steps activate automatically once Go code exists (guarded by
# hashFiles('**/*.go')); the doc-integrity step always runs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Dependency set is small and verify checks module drift explicitly.
          cache: false

      - name: Determine verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [[ -n "$changed" ]] && ! grep -qvE '(^|/)([^/]+\.md)$|^docs/|^website/|^mkdocs\.yml$|^requirements-docs(\.lock)?\.txt$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify repo
        if: steps.scope.outputs.docs_only != 'true' && hashFiles('**/*.go') != ''
        run: bash ./scripts/verify.sh

      - name: Verify documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        run: |
          mkdir -p "$(go env GOPATH)/bin"
          GOBIN="$(go env GOPATH)/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  platform-matrix:
    needs: [verify, security]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            smoke: true
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            smoke: true
          - name: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...

      - name: Smoke test on native platform
        if: ${{ matrix.smoke }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test ./...
