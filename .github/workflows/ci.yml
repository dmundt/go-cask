name: CI

# Enforces the gates required by the instruction set:
#   coding-guidelines §9   — gofmt, go vet, go test, go build; no product → examples imports
#   testing-strategy §5    — -race, coverage ≥ 90% on cas/ + gitlike, fuzz smoke
#   AGENT.md §9            — document integrity (mermaid balance, file refs)
#
# Go steps activate automatically once Go code exists (guarded by
# hashFiles('**/*.go')); the doc-integrity step always runs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # std-lib-only module: no go.sum to key a module cache on
          cache: false

      - name: Verify repo
        if: hashFiles('**/*.go') != ''
        run: bash ./scripts/verify.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        run: |
          mkdir -p "$(go env GOPATH)/bin"
          GOBIN="$(go env GOPATH)/bin" go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  platform-matrix:
    needs: [verify, security]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            smoke: true
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            smoke: true
          - name: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            smoke: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...

      - name: Smoke test on native platform
        if: ${{ matrix.smoke }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test ./...
