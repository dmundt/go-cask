name: CodeQL

# Advanced setup, scoped by changed paths (.github/AGENT.md, "Code scanning").
#
# Do NOT enable the repository's default setup for code scanning: GitHub then
# DISABLES this workflow (it did, on 2026-09-22, and nothing said so), and the
# analyses become unscoped — actions and go on every pull request and every push,
# plus javascript-typescript and python over four vendored or build-time files
# that have never produced a finding. Turning it off and re-enabling this
# workflow is the whole fix.
#
# `push` on main is what keeps the Security tab's default-branch alerts current;
# CodeQL's own validation warns without it, and the default setup's "Push on main"
# runs were doing that job until now. The path filters keep a documentation merge
# from starting a run at all, and the scope job below narrows it further, so a Go
# merge analyzes Go and a workflow merge analyzes the workflows.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/**
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      actions_changed: ${{ steps.changes.outputs.actions_changed }}
      go_changed: ${{ steps.changes.outputs.go_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine analysis scope
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A pull request and a push both have a base to diff against; a
          # scheduled or manual run has nothing to compare, so it analyzes
          # everything. Every fallback below widens the analysis rather than
          # narrowing it: a narrowed run is a silently unanalyzed change.
          everything() {
            echo "actions_changed=true" >> "$GITHUB_OUTPUT"
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          }

          case "$EVENT" in
          pull_request | push) ;;
          *)
            everything
            exit 0
            ;;
          esac

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "scope: no base to diff for a $EVENT event; analyzing everything" >&2
            everything
            exit 0
          fi
          if ! changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
            echo "scope: git diff $BASE_SHA..$HEAD_SHA failed; analyzing everything" >&2
            everything
            exit 0
          fi

          if grep -Eq '^\.github/workflows/' <<< "$changed_files"; then
            echo "actions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "actions_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '(^|/).*\.go$|^go\.(mod|sum)$' <<< "$changed_files"; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-actions:
    name: Analyze (actions)
    needs: scope
    if: needs.scope.outputs.actions_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:actions

  analyze-go:
    name: Analyze (go)
    needs: scope
    if: needs.scope.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: go
          build-mode: manual
      - name: Build Go
        run: go build ./...
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:go
