name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - website/**
      - mkdocs.yml
      - requirements-docs.txt
      - requirements-docs.lock
      - README.md
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs dependencies
        run: python -m pip install --require-hashes -r requirements-docs.lock

      - name: Validate Impressum secret
        env:
          IMPRESSUM: ${{ secrets.IMPRESSUM_HTML }}
        run: >-
          python -c "import os, sys;
          sys.exit(0 if os.environ['IMPRESSUM'].strip()
          else 'IMPRESSUM_HTML secret must not be empty.')"

      - name: Resolve site build provenance
        id: provenance
        env:
          HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          HEAD_COMMIT_ID: ${{ github.event.head_commit.id }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          # The deployed revision, not the clock: a push event already carries
          # the commit, while workflow_dispatch does not, so fall back to the
          # checked-out revision. Two builds of one revision therefore produce
          # the same footer.
          build_date="$HEAD_COMMIT_TIMESTAMP"
          if [ -z "$build_date" ]; then
            build_date="$(git log -1 --format=%cI)"
          fi
          revision="$(printf '%s' "$HEAD_COMMIT_ID" | cut -c1-7)"
          if [ -z "$revision" ]; then
            revision="$(printf '%s' "$EVENT_SHA" | cut -c1-7)"
          fi
          printf 'REVISION=%s\n' "$revision"
          printf 'BUILD_DATE=%s\n' "$build_date"
          {
            printf 'date=%s\n' "$build_date"
            printf 'revision=%s\n' "$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Build site
        env:
          IMPRESSUM: ${{ secrets.IMPRESSUM_HTML }}
          SITE_BUILD_DATE: ${{ steps.provenance.outputs.date }}
          SITE_REVISION: ${{ steps.provenance.outputs.revision }}
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
