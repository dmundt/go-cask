openapi: 3.0.3
info:
  title: CASK CAS API
  description: >
    JSON data API of the content-addressed object store. Objects are raw bytes
    addressed by the hash of their content (algo:digest), immutable and
    deduplicated. Consumed by the viewer backend and by other programmatic
    clients (CLI, SDK, services). All endpoints are rate-limited per caller
    IP and MAY return 429 Too Many Requests (see R-14).
  version: 1.0.0
servers:
  - url: /api/cas/v1
    description: CAS object-store data API
tags:
  - name: Objects
  - name: Stats
  - name: Maintenance
paths:
  /objects:
    post:
      tags: [Objects]
      summary: Store an object
      description: >
        Body is the raw bytes to store (application/octet-stream) or a JSON
        envelope stored as-is. The server computes the hash with ?algo
        (default sha256). Same content => same hash => deduplicated.
      parameters:
        - name: algo
          in: query
          schema: { type: string, default: sha256 }
          description: Registered hash algorithm
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: Object stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                    example: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                  deduplicated:
                    type: boolean
                    example: false
        '400':
          description: Unknown algorithm or empty body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Objects]
      summary: List objects
      parameters:
        - name: algo
          in: query
          schema: { type: string }
          description: Filter by hash algorithm
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Object list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 1234
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        hash: { type: string, example: sha256:9f86d081... }
                        algorithm: { type: string, example: sha256 }
                        size: { type: integer, example: 11 }
  /objects/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+:[0-9a-f]+$'
          example: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    get:
      tags: [Objects]
      summary: Retrieve object bytes
      description: >
        Streams the raw stored bytes. Metadata in response headers:
        X-CAS-Algorithm, X-CAS-Size, X-CAS-Type (type is best effort).
      responses:
        '200':
          description: Stored bytes
          headers:
            X-CAS-Algorithm:
              schema: { type: string, example: sha256 }
            X-CAS-Size:
              schema: { type: integer, example: 11 }
            X-CAS-Type:
              schema: { type: string, example: blob }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Malformed hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Object not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Objects]
      summary: Delete object
      description: 'Role: admin. Deleting a missing object is a no-op.'
      responses:
        '204':
          description: Deleted
        '400':
          description: Malformed hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Forbidden (insufficient role)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /objects/{hash}/meta:
    parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+:[0-9a-f]+$'
    get:
      tags: [Objects]
      summary: Object metadata and references
      description: >
        size, type (best effort via the self-describing envelope, cas-core
        §8 decision 1), and the
        object's References() when decodable.
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash: { type: string }
                  algorithm: { type: string }
                  size: { type: integer }
                  type: { type: string }
                  references:
                    type: array
                    items: { type: string }
        '400':
          description: Malformed hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Object not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /objects/{hash}/verify:
    parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+:[0-9a-f]+$'
    post:
      tags: [Maintenance]
      summary: Verify object integrity
      description: 'Role: operator. Recomputed hash must equal the stored address.'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash: { type: string }
                  valid: { type: boolean, example: true }
                  recomputed: { type: string }
        '400':
          description: Malformed hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Object not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /stats:
    get:
      tags: [Stats]
      summary: Storage statistics
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  object_count:
                    type: integer
                    example: 1234
                  total_size:
                    type: integer
                    example: 47390000
                  algorithm_counts:
                    type: object
                    additionalProperties: { type: integer }
                    example: { sha256: 1198, sha1: 36 }
  /gc:
    post:
      tags: [Maintenance]
      summary: Run mark-and-sweep garbage collection
      description: >
        Role: admin. Body lists the reachable hashes; everything else is
        deleted. Audit-logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reachable:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: GC result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, example: 42 }
        '400':
          description: Invalid reachable set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Forbidden (insufficient role)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /openapi.yaml:
    get:
      tags: [Stats]
      summary: This OpenAPI document
      responses:
        '200':
          description: CAS API OpenAPI 3.0 document (text/yaml)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-role API token (viewer/operator/admin)
  responses:
    RateLimited:
      description: Rate limited — too many requests from this IP (R-14)
      headers:
        Retry-After:
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: not found }
security:
  - bearerAuth: []
