site_name: go-cask
site_description: Content-addressable storage for Go
site_url: https://go-cask.dev/

# The footer's copyright line. The theme renders this value verbatim, and
# website/macros.py completes it before any page renders: the year after
# `&copy;` and the deployed revision's date, linked to that commit, both
# read from the checked-out revision. Keep it one line and keep the
# `&copy;` token — that token is where the hook inserts the year, and
# `python3 website/macros.py --selftest` pins both the line and the
# insertion. With no readable revision the line renders exactly as
# written here: no year and no fragment.
copyright: >-
  &copy; Daniel Mundt &middot; <a href="/impressum/">Impressum</a> &middot;
  <a href="/privacy/">Privacy</a> &middot;
  <a href="https://github.com/dmundt/go-cask">GitHub</a>

docs_dir: website
site_dir: site
exclude_docs: |
  AGENT.md
  macros.py

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Content-addressable storage: concepts/index.md
      - Content identity: concepts/content-addressing.md
      - Hash algorithms: concepts/hashes.md
      - Serialization codecs: concepts/codecs.md
      - Storage backends: concepts/backends.md
  - Guides:
      - Filesystem storage: recipes/filesystem-backend.md
      - Custom codecs: recipes/custom-codec.md
  - Reference:
      - Architecture: architecture.md
      - Viewer (cask web): viewer.md
      - Object envelope: specifications/object-format.md
      - Design specifications: specifications/index.md
      - Specification index: specs.md
  - Project:
      - Contributing: contributing.md
      - FAQ: faq.md
      - Changelog: changelog.md

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: blue grey
    accent: blue

plugins:
  - search
  - macros:
      module_name: website/macros

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/os-theme.js
  - javascripts/mermaid-10.9.5.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
