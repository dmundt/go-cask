site_name: go-cask
site_description: Content-addressable storage for Go
site_url: https://go-cask.dev/

docs_dir: website
site_dir: site
exclude_docs: |
  AGENT.md
  macros.py

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Content-addressable storage: concepts/index.md
      - Content identity: concepts/content-addressing.md
      - Hash algorithms: concepts/hashes.md
      - Serialization codecs: concepts/codecs.md
      - Storage backends: concepts/backends.md
  - Guides:
      - Filesystem storage: recipes/filesystem-backend.md
      - Custom codecs: recipes/custom-codec.md
  - Reference:
      - Architecture: architecture.md
      - Object envelope: specifications/object-format.md
      - Design specifications: specifications/index.md
      - Specification index: specs.md
  - Project:
      - Contributing: contributing.md
      - FAQ: faq.md
      - Changelog: changelog.md

theme:
  name: material
  custom_dir: website/overrides
  font: false
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: blue grey
    accent: blue

plugins:
  - search
  - macros:
      module_name: website/macros

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/os-theme.js
  - javascripts/mermaid-10.9.5.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  # Filled in by website/macros.py before any page or template renders, from
  # the SITE_BUILD_DATE and SITE_REVISION environment variables with a git
  # fallback; empty here so `mkdocs build --strict` accepts a configuration
  # that has not been through the hook yet. The footer partial overrides this
  # pair and omits whichever value is empty.
  SITE_BUILD_DATE: ''
  SITE_REVISION: ''
