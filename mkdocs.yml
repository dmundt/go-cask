site_name: go-cask
site_description: Content-addressable storage for Go
site_url: https://dmundt.github.io/go-cask/
repo_url: https://github.com/dmundt/go-cask
repo_name: dmundt/go-cask
edit_uri: edit/main/website/

docs_dir: website
site_dir: site
exclude_docs: AGENT.md

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Content-addressable storage: concepts/index.md
      - Content identity: concepts/content-addressing.md
      - Hash algorithms: concepts/hashes.md
      - Serialization codecs: concepts/codecs.md
      - Storage backends: concepts/backends.md
  - Guides:
      - Filesystem storage: recipes/filesystem-backend.md
      - Custom codecs: recipes/custom-codec.md
  - Reference:
      - Architecture: architecture.md
      - Object envelope: specifications/object-format.md
      - Design specifications: specifications/index.md
      - Specification index: specs.md
  - Project:
      - Contributing: contributing.md
      - FAQ: faq.md
      - Changelog: changelog.md
  - Impressum: impressum.md

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dmundt/go-cask
